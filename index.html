<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SplitWisely — Despesas partilhadas</title>
  <meta name="theme-color" content="#2140c8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="SplitWisely" />
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></span> SplitWisely</a>
    <div class="topbar-right" id="topbar-user"></div>
  </header>

  <main id="app"></main>

  <!-- Ecrã de arranque: fica por cima de tudo enquanto os dados carregam -->
  <div id="splash" class="splash">
    <div class="splash-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></span><span>SplitWisely</span></div>
    <div class="spinner" role="status" aria-label="A carregar"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Configuração opcional: copiar config.example.js para config.js -->
  <script src="config.js" onerror="void 0"></script>
  <script src="vendor/supabase.js"></script>
  <script src="import-parser.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      // O sw.js serve a app da cache (arranque instantâneo) e revalida em
      // segundo plano. Aqui só lhe pedimos que procure versões novas: ao
      // arrancar, sempre que a app volta a ficar visível e de 5 em 5 minutos
      // se ficar aberta. Quando encontra, avisa o app.js por postMessage e a
      // versão nova entra sozinha — sem limpar a cache à mão.
      const checkUpdate = (reg) => {
        reg.update().catch(() => {});
        navigator.serviceWorker.controller?.postMessage({ type: "check-update" });
      };
      navigator.serviceWorker.register("sw.js")
        .then((reg) => {
          checkUpdate(reg);
          setInterval(() => checkUpdate(reg), 300000);
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") checkUpdate(reg);
          });
        })
        .catch(() => {});
    }
    // iOS Safari ignora "user-scalable=no": bloquear o pinch-zoom
    // (o double-tap zoom é tratado pelo touch-action: manipulation no CSS)
    document.addEventListener("gesturestart", (e) => e.preventDefault());
  </script>
</body>
</html>
